<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scoreboard</title>
<style>
  :root{
    --bg:#0b1220;
    --card:#151f33;
    --card-border:#22304a;
    --text:#eaf0fb;
    --muted:#7a8aa8;
    --red:#ef4444;
    --green:#22c55e;
    --blue:#3b82f6;
  }
  *{box-sizing:border-box;}
  html{touch-action:manipulation;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
  }
  .name{-webkit-user-select:text;user-select:text;}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid var(--card-border);
    gap:12px;
    flex-wrap:wrap;
  }
  .left-group{display:flex;align-items:center;gap:16px;}
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:none;border:none;color:var(--text);
    font-size:17px;font-weight:600;cursor:pointer;padding:8px 4px;
  }
  .title-wrap{display:flex;align-items:center;gap:8px;}
  h1{
    font-size:26px;margin:0;font-weight:800;letter-spacing:-0.3px;
  }
  h1[contenteditable="true"]{outline:none;border-bottom:1px dashed transparent;}
  h1[contenteditable="true"]:focus{border-bottom:1px dashed var(--muted);}
  .pencil{cursor:pointer;font-size:16px;opacity:0.7;}
  .right-group{display:flex;align-items:center;gap:12px;}
  .reset-btn{
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text);
    padding:10px 16px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .reset-btn:active{transform:scale(0.97);}
  .count-badge{
    background:var(--blue);
    color:white;
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;
  }
  .add-btn{
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--green);
    padding:10px 16px;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:16px;
    padding:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    position:relative;
  }
  .card-top{
    width:100%;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:6px;
  }
  .num{
    color:var(--muted);
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
  }
  .name{
    flex:1;
    text-align:right;
    font-size:17px;
    color:var(--muted);
    outline:none;
    min-width:0;
    cursor:text;
    white-space:normal;
    word-break:break-word;
    line-height:1.25;
    max-height:calc(1.25em * 2);
    overflow:hidden;
  }
  .name.named{color:var(--text);}
  .name:focus{
    color:var(--text);
    max-height:none;
    overflow:visible;
  }
  .score{
    font-size:52px;
    font-weight:800;
    letter-spacing:1px;
    margin:4px 0;
    font-variant-numeric:tabular-nums;
  }
  .btn-row{display:flex;gap:14px;}
  .circle-btn{
    width:52px;height:52px;
    border-radius:50%;
    border:2px solid var(--red);
    background:transparent;
    color:var(--red);
    font-size:26px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .circle-btn.plus{border-color:var(--green);color:var(--green);}
  .circle-btn:active{transform:scale(0.92);}
  .remove-x{
    position:absolute;
    top:8px;right:8px;
    color:var(--muted);
    background:none;border:none;
    font-size:14px;
    cursor:pointer;
    opacity:0.5;
    padding:4px;
  }
  .remove-x:hover{opacity:1;}
  .status{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:8px 20px 0;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="left-group">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <div class="title-wrap">
      <h1 id="title" contenteditable="true" spellcheck="false">Scoreboard</h1>
      <span class="pencil">✏️</span>
    </div>
  </div>
  <div class="right-group">
    <button class="add-btn" id="addBtn">+ Add</button>
    <button class="reset-btn" id="resetBtn">Reset All</button>
    <div class="count-badge" id="countBadge">0</div>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="status" id="status"></div>

<script>
const STORAGE_KEY = 'scoreboard-state-v1';
let state = null;

function defaultState(){
  const players = [];
  for(let i=1;i<=15;i++){
    players.push({id:i, name:'', score:0});
  }
  return { title:'Scoreboard', nextId:16, players };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
    } else {
      state = defaultState();
    }
  }catch(e){
    state = defaultState();
  }
  render();
}

let saveTimeout = null;
function saveState(){
  clearTimeout(saveTimeout);
  const statusEl = document.getElementById('status');
  saveTimeout = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      statusEl.textContent = '';
    }catch(e){
      statusEl.textContent = 'Could not save — storage unavailable';
    }
  }, 150);
}

function render(){
  document.getElementById('title').textContent = state.title;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  state.players.forEach((p, idx)=>{
    const card = document.createElement('div');
    card.className = 'card';

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-x';
    removeBtn.textContent = '✕';
    removeBtn.onclick = ()=>{
      state.players = state.players.filter(pl=>pl.id!==p.id);
      saveState();
      render();
    };
    card.appendChild(removeBtn);

    const top = document.createElement('div');
    top.className = 'card-top';

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = '#' + (idx+1);
    top.appendChild(num);

    const nameEl = document.createElement('div');
    nameEl.className = 'name' + (p.name ? ' named' : '');
    nameEl.contentEditable = true;
    nameEl.spellcheck = false;
    nameEl.textContent = p.name || '(unnamed)';
    nameEl.onfocus = ()=>{
      if(!p.name) nameEl.textContent = '';
    };
    nameEl.onblur = ()=>{
      const val = nameEl.textContent.trim();
      p.name = val;
      nameEl.textContent = val || '(unnamed)';
      nameEl.className = 'name' + (val ? ' named' : '');
      saveState();
    };
    top.appendChild(nameEl);
    card.appendChild(top);

    const scoreEl = document.createElement('div');
    scoreEl.className = 'score';
    scoreEl.textContent = p.score;
    card.appendChild(scoreEl);

    const row = document.createElement('div');
    row.className = 'btn-row';

    const minus = document.createElement('button');
    minus.className = 'circle-btn';
    minus.textContent = '–';
    minus.onclick = ()=>{
      p.score -= 1;
      scoreEl.textContent = p.score;
      saveState();
      updateBadge();
    };

    const plus = document.createElement('button');
    plus.className = 'circle-btn plus';
    plus.textContent = '+';
    plus.onclick = ()=>{
      p.score += 1;
      scoreEl.textContent = p.score;
      saveState();
      updateBadge();
    };

    row.appendChild(minus);
    row.appendChild(plus);
    card.appendChild(row);

    grid.appendChild(card);
  });
  updateBadge();
}

function updateBadge(){
  const withScore = state.players.filter(p=>p.score>0).length;
  document.getElementById('countBadge').textContent = withScore;
}

document.getElementById('title').addEventListener('blur', ()=>{
  const val = document.getElementById('title').textContent.trim();
  state.title = val || 'Scoreboard';
  saveState();
});

document.getElementById('addBtn').addEventListener('click', ()=>{
  state.players.push({id: state.nextId++, name:'', score:0});
  saveState();
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Reset all scores to 0?')){
    state.players.forEach(p=> p.score = 0);
    saveState();
    render();
  }
});

loadState();

// Block double-tap-to-zoom on iPad/iOS Safari (viewport lock alone doesn't
// always stop it on fast double taps).
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  const now = Date.now();
  if(now - lastTouchEnd <= 350){
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive:false });

// Also block pinch/gesture zoom (Safari-specific gesture events).
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
</script>

</body>
</html>
